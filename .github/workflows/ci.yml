name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # wps7 drives ConPTY through node-pty, so the suite only runs on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Third-party notices are current
        shell: pwsh
        run: |
          npm run licenses:generate
          if (-not (git diff --quiet -- THIRD-PARTY-LICENSES.md)) {
            git --no-pager diff -- THIRD-PARTY-LICENSES.md
            throw 'THIRD-PARTY-LICENSES.md is stale. Run "npm run licenses:generate" and commit the result.'
          }
